<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc">
  <title id="title">Makina eye</title>
  <desc id="desc">A dark Egyptian-inspired eye mark with a teal pupil, ivory strokes, and curved lower lashes.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16112c"/>
      <stop offset="54%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="21" fill="url(#bg)"/>
  <circle cx="50" cy="51" r="42" fill="#4f46e5" opacity="0.12" filter="url(#softGlow)"/>
  <g transform="translate(4 4) scale(0.36)" fill="none" stroke-linecap="round" stroke-linejoin="round">
