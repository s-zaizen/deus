<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bg" cx="38%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <radialGradient id="eyeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4f46e5" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d1fae5"/>
      <stop offset="35%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0f3d3e"/>
      <stop offset="100%" stop-color="#071112"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeGlowLarge">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="irisClipL">
      <circle cx="0" cy="0" r="148"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Eye ambient halo -->
  <circle cx="310" cy="320" r="260" fill="url(#eyeHalo)" filter="url(#eyeGlowLarge)"/>

  <!-- Curved lash eye mark, preserving the selected proposal geometry. -->
  <g transform="translate(50, 58) scale(2.05)">
    <circle cx="128" cy="128" r="118" fill="#0f1a1a" opacity="0.2"/>
    <path d="M 64 100 Q 128 60 192 100" stroke="#d8c7aa" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 76 128 Q 128 84 180 128" stroke="#f4f1e8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="128" cy="126" r="9" fill="#14b8a6"/>
    <circle cx="132" cy="122" r="3" fill="#99f6e4"/>
    <path d="M 76 128 Q 128 196 180 128" stroke="#d8c7aa" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 76 128 Q 128 196 180 128" stroke="#b98252" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 100 168 Q 84 196 76 216" stroke="#d8c7aa" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 128 184 Q 128 216 128 236" stroke="#d8c7aa" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 156 168 Q 172 196 180 216" stroke="#d8c7aa" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Vertical separator -->
  <line x1="580" y1="100" x2="580" y2="540" stroke="#1a2035" stroke-width="1.5"/>
  <!-- Separator glow dots -->
  <circle cx="580" cy="100" r="3" fill="#8b5cf6" opacity="0.68"/>
  <circle cx="580" cy="540" r="3" fill="#8b5cf6" opacity="0.68"/>

  <!-- ═══════════════════════════════════════════
       TEXT CONTENT  (right panel, x=620–1230) — leaves
       a ~50px right margin so the trailing "a" never
       touches the canvas edge.
       ═══════════════════════════════════════════ -->

  <!-- "makina" main title -->
  <!-- Shadow/glow layer -->
  <text x="620" y="320"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono',ui-monospace,monospace"
        font-size="170" font-weight="700" letter-spacing="-6"
        fill="#8b5cf6" opacity="0.24" filter="url(#textGlow)">makina</text>
  <!-- Main text -->
  <text x="620" y="320"
        font-family="'SF Mono','Cascadia Code','JetBrains Mono',ui-monospace,monospace"
        font-size="170" font-weight="700" letter-spacing="-6"
        fill="#f4f1e8">makina</text>

</svg>
